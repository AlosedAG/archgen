[project]
name = "archscope-integrations"
version = "0.4.0"
description = "Adapters implementing ArchitectureScope domain ports against external services (HubSpot, read-only)."
requires-python = ">=3.11"
dependencies = [
    "archscope-domain",
    "hubspot-api-client>=12.0.0",
    "requests>=2.31",
]

[tool.uv.sources]
archscope-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archscope_integrations"]
