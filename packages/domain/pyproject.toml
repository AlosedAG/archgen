[project]
name = "archscope-domain"
version = "0.4.0"
description = "ArchitectureScope domain logic: blueprint, audits, reports, diagrams, proposals, discovery, exports."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "python-docx>=1.1.0",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archscope_domain"]
