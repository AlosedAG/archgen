      assumptions:
        - "Each region or business unit names a decision-maker and a data owner."
        - "Data residency requirements are confirmed by the client's legal team before architecture sign-off."
      risks:
        - {risk: "Regions disagree on shared pipeline and property definitions", likelihood: "High", impact: "High", mitigation: "Global design authority with regional sign-off at each phase"}
        - {risk: "Integration and migration volumes stretch the timeline", likelihood: "Medium", impact: "High", mitigation: "Phase migrations by region and test with full-volume samples"}
