sizes:
  smb:
    label: "Small business"
    description: "Up to about 20 users, one location, one team doing several jobs."
    discovery:
      answers:
        Data:
          volume: "Under 10k contacts"
          org_structure: "Single location"
        Goals:
          timeline: "1–3 months"
        Solutions Design:
          team_sizes: "6–20 users"
          prior_tools: "New to CRMs"
          mvp_date: "1–3 months"
    proposal:
      assumptions:
        - "One HubSpot portal, one business unit and one currency."
      risks:
        - {risk: "Limited client time for testing and training", likelihood: "Medium", impact: "Medium", mitigation: "Fixed weekly working sessions and recorded training"}
      scope:
        - {status: "Out of Scope", workstream: "Architecture", item: "Multiple business units, brands or currencies", quantity_limit: "", acceptance_criteria: ""}

  mid_market:
    label: "Mid-market (10–500 employees)"
    description: "Several teams and locations using Sales, Marketing and Operations Hub together."
    discovery:
      answers:
        Data:
          volume: "10k–100k contacts"
          org_structure: "Multiple locations (same country)"
          cleansing_frequency: "Ad hoc / rarely"
        Goals:
          timeline: "3–6 months"
        Solutions Design:
          team_sizes: "21–50 users"
          prior_tools: "Experienced with another CRM"
          mvp_date: "3–6 months"
    proposal:
      scope:
        - {status: "In Scope", workstream: "Governance", item: "Teams, permission sets and record-ownership rules", quantity_limit: "Up to 5 teams", acceptance_criteria: "Each team sees and edits only the agreed records"}
        - {status: "In Scope", workstream: "Data", item: "Data migration from current CRM and spreadsheets with deduplication", quantity_limit: "Up to 3 sources, 4 objects", acceptance_criteria: "Record counts reconcile within 1% after import"}
      risks:
        - {risk: "Data quality issues across several legacy sources", likelihood: "High", impact: "Medium", mitigation: "Data audit and cleansing rules agreed before migration"}

  enterprise:
    label: "Enterprise / global"
    description: "Multi-region, multi-entity organisations with complex sales structures and governance."
    discovery:
      answers:
        Data:
          volume: "100k–500k contacts"
          org_structure: "Multi-region / international"
          data_regions: ["United States", "EU / UK", "Asia-Pacific"]
          compliance: ["Data residency requirements"]
        Goals:
          timeline: "6–12 months"
        Solutions Design:
          team_sizes: "51–200 users"
          prior_tools: "Mixed across the team"
          mvp_date: "6+ months"
    proposal:
      scope:
        - {status: "In Scope", workstream: "Governance", item: "Business-unit partitioning, teams and permission sets", quantity_limit: "Up to 5 business units, 15 teams", acceptance_criteria: "Each business unit's users see only their own records; HQ sees all"}
        - {status: "In Scope", workstream: "Governance", item: "Data governance model: owners, naming conventions and change control", quantity_limit: "1 governance document", acceptance_criteria: "Signed off by the client's data owners"}
