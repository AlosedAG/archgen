        - {type: "Secondary", kpi: "Manual hours saved", definition: "Estimated hours per month no longer spent on automated tasks", target: "To be agreed"}
      glossary:
        - {term: "System of record", definition: "The system whose value wins when two systems disagree."}
        - {term: "Custom-coded action", definition: "A workflow step that runs a short script for logic standard actions cannot handle."}

