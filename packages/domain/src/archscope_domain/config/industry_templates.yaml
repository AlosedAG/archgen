        - {status: "In Scope", workstream: "Service", item: "Knowledge base set-up and article migration", quantity_limit: "Up to 30 articles", acceptance_criteria: "Articles published, searchable and suggested in chat"}
        - {status: "In Scope", workstream: "Service", item: "Customer health score and renewal alerts", quantity_limit: "1 score, 1 workflow", acceptance_criteria: "At-risk accounts create CSM tasks"}
        - {status: "In Scope", workstream: "Service", item: "NPS and CSAT surveys with detractor follow-up", quantity_limit: "Up to 2 surveys", acceptance_criteria: "Detractors create a follow-up task"}
        - {status: "In Scope", workstream: "Reporting", item: "Service and retention dashboards", quantity_limit: "Up to 2 dashboards", acceptance_criteria: "Ticket and renewal figures match source records"}
