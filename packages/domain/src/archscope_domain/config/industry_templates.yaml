  # ── Catering ───────────────────────────────────────────────────────────

  catering:
    label: "Catering Template"
    description: "Event enquiries, menu quotes, deposits, booking confirmation and rebooking for catering and event food businesses."
    discovery:
      business_type: "Catering / events food service company"
      answers:
        Goals:
          growth_areas: ["New customer acquisition", "Upsell / cross-sell to existing customers", "Retention / renewals"]
          kpis: ["Lead volume", "Lead-to-customer rate", "Win rate", "Revenue / ARR growth"]
          reason_for_switching: ["Missing automation", "Consolidating multiple tools", "Lack of reporting / visibility"]
        Data:
          data_location: ["Spreadsheets", "Email inboxes", "Billing / accounting system"]
          systems: ["Excel / Google Sheets", "QuickBooks"]
          custom_data: ["Appointments / events", "Locations / sites", "Products / line items"]
          data_owners: ["Sales leadership"]
        Processes:
          journey_stages: ["Lead", "Opportunity", "Customer", "Evangelist / advocate"]
          team_processes: ["Inbound lead handling", "Quoting / proposals", "Account management"]
          communication: ["Email", "Phone", "In person"]
          pain_points: ["Slow lead follow-up", "Manual data entry", "Disconnected tools"]
        Solutions Design:
          primary_users: ["Sales", "Marketing", "Operations / RevOps"]
          required_actions: ["Record creation from forms", "Quote generation", "Task reminders", "Internal notifications"]
          integrations: ["Gmail / Google Workspace", "Accounting (QuickBooks, Xero, NetSuite…)", "Stripe / payments"]
          priority_features: ["Deal pipelines", "Quotes", "Landing pages / forms", "Email marketing"]
    proposal:
      objectives:
        - {objective: "Capture every event enquiry with date, guest count and venue", success_measure: "All enquiries in HubSpot with event date, headcount and budget"}
        - {objective: "Turn enquiries into confirmed bookings faster", success_measure: "Days from enquiry to menu proposal reported monthly"}
        - {objective: "Win repeat and corporate business", success_measure: "Repeat clients flagged and rebooking reminders sent ahead of annual events"}
      scope:
        - {status: "In Scope", workstream: "Sales", item: "Event enquiry form with event type, date, guest count, venue and dietary needs", quantity_limit: "1 form", acceptance_criteria: "Submissions create a contact and an event deal with all fields filled"}
        - {status: "In Scope", workstream: "Sales", item: "Booking pipeline: enquiry, tasting, proposal sent, deposit paid, confirmed, delivered", quantity_limit: "1 pipeline", acceptance_criteria: "Stages and required fields match the signed-off design"}
        - {status: "In Scope", workstream: "Sales", item: "Menu and package product library with per-head pricing and quote templates", quantity_limit: "Up to 50 products, 2 templates", acceptance_criteria: "A test quote calculates per-head totals correctly"}
        - {status: "In Scope", workstream: "Operations", item: "Confirmation workflow: deposit reminder, final numbers request and kitchen hand-off", quantity_limit: "Up to 3 workflows", acceptance_criteria: "Confirmed deals notify the operations lead and create pre-event tasks"}
        - {status: "In Scope", workstream: "Marketing", item: "Post-event feedback and rebooking emails", quantity_limit: "1 workflow, 3 emails", acceptance_criteria: "Delivered events trigger feedback 2 days later"}
        - {status: "In Scope", workstream: "Reporting", item: "Bookings dashboard: enquiries, conversion, event value and upcoming events", quantity_limit: "1 dashboard", acceptance_criteria: "Confirmed revenue matches invoices for a sample month"}
        - {status: "Out of Scope", workstream: "Operations", item: "Kitchen production planning, inventory, staff rostering or allergen labelling", quantity_limit: "", acceptance_criteria: ""}
        - {status: "Optional Add-on", workstream: "Integrations", item: "Payment links for deposits and accounting sync for invoices", quantity_limit: "1 payment provider, 1 accounting system", acceptance_criteria: "A deposit payment moves the deal to Deposit paid"}
        - {status: "Client Responsibility", workstream: "Content", item: "Menus, package descriptions, prices and photography", quantity_limit: "", acceptance_criteria: ""}
      assumptions:
        - "Events are priced per head or per package from a defined menu list."
        - "Kitchen and staffing operations continue in the client's existing tools."
      risks:
        - {risk: "Seasonal peaks leave little time for testing and training", likelihood: "Medium", impact: "Medium", mitigation: "Schedule go-live and training outside the busiest months"}
        - {risk: "Dietary and allergen details captured inconsistently", likelihood: "Medium", impact: "High", mitigation: "Structured dietary fields required before an event is confirmed"}
      kpis:
        - {type: "Primary", kpi: "Enquiry-to-booking rate", definition: "Confirmed events divided by new enquiries", target: "To be agreed"}
        - {type: "Primary", kpi: "Average event value", definition: "Mean value of confirmed event deals", target: "To be agreed"}
        - {type: "Secondary", kpi: "Repeat booking rate", definition: "Clients who book again within 12 months", target: "To be agreed"}
      glossary:
        - {term: "Per-head pricing", definition: "A price per guest, multiplied by the final guest count."}
        - {term: "Final numbers", definition: "The confirmed guest count the client supplies before the event."}

