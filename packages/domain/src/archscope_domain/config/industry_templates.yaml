        - "The client's HubSpot plan includes data sync, custom-coded actions and data-quality tools."
        - "Each synced field has an agreed system of record."
      risks:
        - {risk: "Two-way sync overwrites good data with stale values", likelihood: "Medium", impact: "High", mitigation: "Agree a system of record per field and test conflicts before go-live"}
        - {risk: "Custom code breaks when an external API changes", likelihood: "Medium", impact: "Medium", mitigation: "Error notifications, documented code and a named internal owner"}
