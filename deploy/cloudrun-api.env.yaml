# Settings for the API on Google Cloud Run (the non-secret ones).
# deploy-api.ps1 sends this whole file on every deploy, so change settings
# HERE and redeploy — not in the Cloud Run console (it would be overwritten).
# Private values (database string, encryption key, Gmail app password) live in
# Google Secret Manager instead; see the Deployment Guide, Step 11.
# Every value must be in quotes.

ARCHSCOPE_ENVIRONMENT: "production"
# Library files are kept in the database: Cloud Run's disk is wiped on restart.
ARCHSCOPE_BLOB_STORE: "database"
# Only these email domains may create an account themselves (comma-separated).
ARCHSCOPE_SIGNUP_ALLOWED_DOMAINS: "sonamation.com"
# Where the Feedback button sends reports.
ARCHSCOPE_FEEDBACK_TO: "aylin@sonamation.com"

# Email (sign-up codes, password resets, Feedback reports) through Gmail.
# Used only when the "archscope-smtp-password" secret exists. Put the Gmail
# address that owns the app password between the quotes.
ARCHSCOPE_SMTP_HOST: "smtp.gmail.com"
ARCHSCOPE_SMTP_PORT: "587"
ARCHSCOPE_SMTP_USERNAME: ""
