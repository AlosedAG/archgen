# Alembic for the ArchitectureScope API. The database URL comes from
# ARCHSCOPE_DATABASE_URL (see archscope_api/settings.py), not this file.
#   uv run alembic -c apps/api/alembic.ini upgrade head
#   uv run alembic -c apps/api/alembic.ini revision --autogenerate -m "describe change"
[alembic]
script_location = %(here)s/src/archscope_api/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
