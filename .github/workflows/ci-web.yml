name: CI · Web

on:
  push:
    branches: [main, "version-*", "rebuild/**"]
    paths: ["apps/web/**", "apps/api/openapi.json", ".github/workflows/ci-web.yml"]
  pull_request:
    paths: ["apps/web/**", "apps/api/openapi.json", ".github/workflows/ci-web.yml"]

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Types · API contract · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: API types match openapi.json
        run: |
          npm run check:api || {
            echo "::error::apps/web/src/lib/api-types.ts is stale. Run 'npm run gen:api' in apps/web and commit it."
            exit 1
          }
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
